name: Release

# Builds every downloadable artifact: the wheel and sdist, standalone executables for
# four platforms with SHA256SUMS, and a multi-arch container image on GHCR.
#
# - Pushing a tag vX.Y.Z publishes the package to PyPI, publishes the image as :X.Y.Z
#   and :latest, and creates the GitHub Release for that tag with every file attached.
# - Every run writes SPDX SBOMs for the source and the image, attests build provenance for
#   the files and the image, signs the image with cosign keyless signing, and fails if
#   Trivy finds a CRITICAL vulnerability in the image.
# - Running the workflow by hand (workflow_dispatch) publishes the image as :edge and
#   uploads the files as workflow run artifacts only.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  PYINSTALLER_VERSION: "6.22.3"

jobs:
  dist:
    name: Wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Check that the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::tag ${TAG} does not match pyproject.toml version ${version}"
            exit 1
          fi
      - run: python -m pip install build
      - run: python -m build
      - name: Install the wheel and run the demo scenario
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          voicebench example mock-conversation -O demo.yaml
          voicebench run demo.yaml --no-write
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  binaries:
    name: Executable (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds run in a Debian 11 container, so the executables need only glibc 2.31.
          - { platform: linux-x64, os: ubuntu-latest, exe: voicebench, container: "python:3.12-slim-bullseye@sha256:411fa4dcfdce7e7a3057c45662beba9dcd4fa36b2e50a2bfcd6c9333e59bf0db" }
          - { platform: linux-arm64, os: ubuntu-24.04-arm, exe: voicebench, container: "python:3.12-slim-bullseye@sha256:411fa4dcfdce7e7a3057c45662beba9dcd4fa36b2e50a2bfcd6c9333e59bf0db" }
          - { platform: macos-arm64, os: macos-14, exe: voicebench, container: "" }
          - { platform: windows-x64, os: windows-latest, exe: voicebench.exe, container: "" }
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.container == ''
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install binutils, which PyInstaller needs on Linux
        if: matrix.container != ''
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends binutils
      - run: python -m pip install . "pyinstaller==${PYINSTALLER_VERSION}"
      - run: pyinstaller --noconfirm --clean packaging/voicebench.spec
      - name: Run the demo scenario with the executable
        run: |
          exe="$GITHUB_WORKSPACE/dist/${{ matrix.exe }}"
          cd "$RUNNER_TEMP"
          "$exe" --version
          "$exe" example mock-conversation -O demo.yaml
          "$exe" run demo.yaml --out demo-report
          test -s demo-report/report.json
      - name: Rename the executable for the release
        run: |
          mkdir upload
          case "${{ matrix.exe }}" in
            *.exe) cp dist/voicebench.exe "upload/voicebench-${{ matrix.platform }}.exe" ;;
            *) cp dist/voicebench "upload/voicebench-${{ matrix.platform }}" ;;
          esac
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: voicebench-${{ matrix.platform }}
          path: upload/*
          if-no-files-found: error

  image:
    name: Container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
      - name: Build the image for the runner and run the demo scenario
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: voicebench:smoke
      - run: |
          docker run --rm voicebench:smoke --version
          docker run --rm voicebench:smoke example mock-conversation > "$RUNNER_TEMP/demo.yaml"
          docker run --rm -v "$RUNNER_TEMP:/work" voicebench:smoke run demo.yaml --no-write
      - name: Fail on CRITICAL vulnerabilities in the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: voicebench:smoke
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Build and push linux/amd64 and linux/arm64
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image with cosign keyless signing
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Attest build provenance for the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Write the image SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: voicebench-image.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-image
          path: voicebench-image.spdx.json
          if-no-files-found: error

  assets:
    name: Collect assets, SBOM, checksums, and provenance
    needs: [dist, binaries, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: source
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: assets
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: voicebench-*
          path: assets
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-image
          path: assets
      - name: Write the source SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: source
          format: spdx-json
          output-file: assets/voicebench-source.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Write SHA256SUMS
        working-directory: assets
        run: |
          chmod +x voicebench-linux-* voicebench-macos-*
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Attest build provenance for the release files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: assets/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: assets/*
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [assets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          # PEP 740 attestations need trusted publishing; the workflow attests the files itself.
          attestations: false
          skip-existing: true

  release:
    name: Create the GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [assets, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: assets
      - name: Extract the release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${version}"
            exit 1
          fi
          cat notes.md
      - name: Create the release, or update the assets of an existing one
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" assets/* --verify-tag --title "$TAG" --notes-file notes.md --latest
          fi
