name: Trivy

# Scans the container image for vulnerabilities. Uploads every finding to code scanning,
# and fails on CRITICAL vulnerabilities that have a fix.

on:
  push:
    branches: [main]
    paths: ["Dockerfile", "pyproject.toml", "src/**", ".github/workflows/trivy.yml"]
  pull_request:
    paths: ["Dockerfile", "pyproject.toml", "src/**", ".github/workflows/trivy.yml"]
  schedule:
    - cron: "5 5 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan the container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t voicebench:scan .
      - name: Write the SARIF report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: voicebench:scan
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH,MEDIUM
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always() && hashFiles('trivy.sarif') != ''
        with:
          sarif_file: trivy.sarif
          category: trivy
      - name: Fail on CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: voicebench:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
