name: Bug report
description: Something in voicebench does not work the way the docs say.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. A scenario file that reproduces the problem is the fastest route to a fix.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: Scenario and command
      description: The scenario YAML and the exact `voicebench` command. Remove URLs, keys, and tokens first.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Console output, and `report.json` if it is relevant.
      render: text
  - type: dropdown
    id: adapter
    attributes:
      label: Adapter
      options:
        - mock
        - websocket
        - livekit
        - pipecat
        - custom
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `voicebench --version` and `python --version`, and your OS.
    validations:
      required: true
