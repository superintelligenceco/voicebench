[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "voicebench"
version = "0.2.0"
description = "Benchmark harness for real-time voice agents: latency, barge-in, and turn-taking measured from the audio."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "superintelligenceco contributors" }]
keywords = ["voice-agents", "benchmark", "latency", "livekit", "pipecat", "vad", "barge-in"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6.0",
  "websockets>=13.0",
]

[project.optional-dependencies]
livekit = ["livekit>=1.0", "livekit-api>=1.0"]
pipecat = ["pipecat-ai>=0.0.80"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "hypothesis>=6.100",
  "pytest-benchmark>=4.0",
]
docs = [
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.26",
]

[project.scripts]
voicebench = "voicebench.cli:main"

[project.urls]
Homepage = "https://github.com/superintelligenceco/voicebench"
Issues = "https://github.com/superintelligenceco/voicebench/issues"
Changelog = "https://github.com/superintelligenceco/voicebench/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/voicebench"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PT"]

[tool.mypy]
strict = true
files = ["src/voicebench"]

[[tool.mypy.overrides]]
module = ["livekit.*", "pipecat.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --benchmark-disable"
markers = [
  "realtime: runs against the wall clock and a local socket (a few seconds each)",
]

[tool.coverage.run]
source = ["voicebench"]
branch = true
omit = ["*/adapters/livekit.py", "*/adapters/pipecat.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
