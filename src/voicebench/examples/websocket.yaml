# Benchmark any agent that speaks the generic PCM-over-WebSocket protocol.
#
# Try it against the bundled mock server:
#   voicebench mock-server --port 8765 &
#   voicebench run examples/websocket.yaml
#
# Point it at your own agent with --url ws://host:port/path.
name: websocket-smoke
description: One question, one barge-in, over a real socket on the wall clock.
sample_rate: 16000
frame_ms: 20

adapter:
  type: websocket
  options:
    url: ws://127.0.0.1:8765
    # agent_sample_rate: 24000       # set if your agent sends a different rate
    # start_message: {type: start}   # sent once as JSON before any audio

defaults:
  response_timeout_ms: 4000

turns:
  - id: question
    audio: {synth: speech, duration_ms: 1500}
    start: {after: session_start, delay_ms: 300}
  - id: barge-in
    audio: {synth: speech, duration_ms: 1200, seed: 1}
    start: {after: agent_speech_start, delay_ms: 700}
    expect: stop
    max_stop_ms: 600

assert:
  max_missed_responses: 0
  min_barge_in_success_rate: 1.0
