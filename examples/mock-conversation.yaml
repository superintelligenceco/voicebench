# A three-part conversation against the built-in mock agent.
# Run it with: voicebench run examples/mock-conversation.yaml
name: mock-conversation
description: Greeting, a question, a barge-in, a cough, and a follow-up.
sample_rate: 16000
frame_ms: 20

adapter:
  type: mock
  options:
    endpoint_silence_ms: 300   # silence the mock waits for before it answers
    response_delay_ms: 350     # extra "thinking" time before it speaks
    jitter_ms: 150             # random extra delay per reply, seeded
    response_ms: 2500          # length of each reply
    barge_in_min_ms: 250       # user speech needed before it treats overlap as barge-in
    interrupt_reaction_ms: 120 # how long it keeps talking after it detects barge-in
    transcripts:               # fixture transcripts, one per detected user turn
      - "hi there i need to change my booking"
      - "it's for next tuesday"
      - "actually wait make it wednesday"
      - "yes that works"

turns:
  - id: opening
    audio: {synth: speech, duration_ms: 1800}
    text: "Hi there, I need to change my booking."
  - id: answer-date
    audio: {synth: speech, duration_ms: 1200, seed: 1}
    start: {after: agent_speech_end, delay_ms: 400}
    text: "It's for next Tuesday."
  - id: barge-in
    audio: {synth: speech, duration_ms: 1400, seed: 2}
    start: {after: agent_speech_start, delay_ms: 900}
    expect: stop
    text: "Actually wait, make it Wednesday."
  - id: cough
    audio: {synth: noise, duration_ms: 180, level_db: -25}
    start: {after: agent_speech_start, delay_ms: 600}
    expect: ignore
  - id: confirm
    audio: {synth: speech, duration_ms: 900, seed: 3}
    start: {after: agent_speech_end, delay_ms: 500}
    text: "Yes, that works."

assert:
  p90_response_latency_ms: 1200
  max_barge_in_stop_ms: 400
  min_barge_in_success_rate: 1.0
  max_false_barge_ins: 0
  max_wer: 0.1
